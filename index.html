<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;margin:0;background:#f5f6fa;color:#17181c;padding:16px;padding-bottom:88px}h1{font-size:28px;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}.hero{background:#4f46e5;color:#fff}.big{font-size:30px;font-weight:800;margin-top:6px}.btn{padding:12px 15px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700;margin:4px 2px;cursor:pointer}.btn.secondary{background:#eef0f5;color:#222}.btn.danger{background:#dc2626}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.nav{overflow-x:auto;position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);display:flex;justify-content:space-around;padding:10px max(8px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 15px rgba(0,0,0,.08)}.nav button{border:0;background:transparent;font-size:12px;color:#555;min-width:58px;flex:0 0 58px}.nav button.active{color:#4f46e5;font-weight:800}dialog{border:0;border-radius:18px;width:min(92%,460px);padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;margin:6px 0;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{padding:12px 4px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:700}.choice.selected{background:#4f46e5;color:#fff;border-color:#4f46e5}.muted{color:#6b7280;font-size:13px}.green{color:#15803d}.red{color:#b91c1c}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:11px;color:#777;font-weight:700;padding:4px}.day{min-height:42px;border:1px solid #eee;background:#fff;border-radius:9px;padding:6px;font-size:12px;cursor:pointer}.day.inrange{background:#ede9fe;border-color:#c4b5fd}.day.start,.day.end{background:#4f46e5;color:#fff}.day.mutedday{opacity:.35}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f8f8fb;border-radius:13px;padding:12px}.cat{display:flex;justify-content:space-between;padding:8px 0}.small{font-size:12px}.spaced{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef0f5;font-size:12px}

:root{--bg:#f5f6fa;--text:#17181c;--card:#fff;--border:#eee;--input:#fff;--muted:#6b7280;--soft:#f8f8fb;--nav:rgba(255,255,255,.96)}
body{--bg:#f5f6fa;--text:#17181c;--card:#fff;--border:#e5e7eb;--input:#fff;--muted:#6b7280;--soft:#f8f8fb;--nav:rgba(255,255,255,.96);--pill-bg:#eef0f5;--pill-text:#17181c;--nav-text:#555;--green:#15803d;--red:#b91c1c}body.dark{--bg:#101114;--text:#f5f5f7;--card:#1b1c20;--border:#303238;--input:#23252a;--muted:#b8bcc6;--soft:#24262c;--nav:rgba(25,26,30,.96);--pill-bg:#34363d;--pill-text:#f5f5f7;--nav-text:#d5d8df;--green:#4ade80;--red:#fb7185}
body{background:var(--bg);color:var(--text)}.card{background:var(--card)}.row{border-color:var(--border)}.nav{background:var(--nav)}.nav button{color:var(--nav-text)}input,select{background:var(--input);color:var(--text);border-color:var(--border)}input::placeholder{color:var(--muted);opacity:1}.stat{background:var(--soft)}.day{background:var(--card);border-color:var(--border)}.choice{background:var(--card);color:var(--text);border-color:var(--border)}.muted{color:var(--muted)}.pill{background:var(--pill-bg);color:var(--pill-text);font-weight:700}.green{color:var(--green)!important}.red{color:var(--red)!important}.positive{color:var(--green)!important;font-weight:800}.negative{color:var(--red)!important;font-weight:800}.neutral{color:var(--muted)!important;font-weight:800}body.dark dialog{background:var(--card);color:var(--text)}body.dark dialog h1,body.dark dialog h2,body.dark dialog h3,body.dark dialog p,body.dark dialog span,body.dark dialog b,body.dark dialog strong,body.dark label{color:inherit}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.status{padding:10px 12px;border-radius:12px;margin-top:10px;font-weight:700;background:var(--soft);color:var(--text)}.status.ok{color:var(--green)}.status.err{color:var(--red)}.saving{opacity:.6;pointer-events:none}.outflow{color:var(--red)!important;font-weight:800}.debt-total{color:#dc2626!important;font-weight:900}.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:170px;height:170px;border-radius:50%;position:relative;flex:0 0 auto}.donut:after{content:"";position:absolute;inset:38px;border-radius:50%;background:var(--card)}.legend{flex:1;min-width:190px}.legend-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}.history{font-size:12px;color:var(--muted);margin:5px 0 0}.action-row{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.tiny-btn{padding:6px 9px;border:0;border-radius:9px;background:#eef0f5;color:#222;font-size:12px;font-weight:700}.tiny-btn.danger{background:#fee2e2;color:#b91c1c}.admin-plus{color:#15803d;font-weight:900}.admin-minus{color:#b91c1c;font-weight:900}.admin-x{color:#dc2626;font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav"><button id="nav-home" onclick="show('home')">🏠<br>Ana</button><button id="nav-courier" onclick="show('courier')">📦<br>Kurye</button><button id="nav-expense" onclick="show('expense')">💸<br>Gider</button><button id="nav-debt" onclick="show('debt')">💳<br>Borç</button><button id="nav-report" onclick="show('report')">📊<br>Rapor</button><button id="nav-settings" onclick="show('settings')">⚙️<br>Ayar</button><button id="nav-admin" onclick="show('admin')">🛠️<br>Admin</button></div>
<dialog id="d"><div id="m"></div></dialog>
<script>
const k='finansPWA';
const app=document.getElementById('app');
const d=document.getElementById('d');
const m=document.getElementById('m');
const num=v=>{ const z=String(v??'').trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.'); const n=Number(z); return Number.isFinite(n)?n:NaN };
let x=JSON.parse(localStorage.getItem(k)||'null')||{deliveries:[],mileage:[],expenses:[],debts:[],debtPayments:[],adminLog:[],rate:6,categories:['Market','Akaryakıt','Hobi','Eğlence','Fatura','Araç Bakım','Parça Maliyeti']};
if(!Array.isArray(x.deliveries)) x.deliveries=[]; if(!Array.isArray(x.mileage)) x.mileage=[]; if(!Array.isArray(x.expenses)) x.expenses=[]; if(!Array.isArray(x.debts)) x.debts=[]; if(!Array.isArray(x.debtPayments)) x.debtPayments=[]; if(!Array.isArray(x.adminLog)) x.adminLog=[]; if(!Array.isArray(x.categories)) x.categories=['Market','Akaryakıt','Hobi','Eğlence','Fatura','Araç Bakım','Parça Maliyeti'];
let busy=false;
const save=()=>{try{const copy={...x};delete copy.autoBackup;localStorage.setItem(k,JSON.stringify(copy));return true}catch(e){console.error(e);alert('Veriler kaydedilemedi. Tarayıcı depolama alanı kullanılamıyor. Lütfen sayfayı yenileyip tekrar deneyin.');return false}};
const tl=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(n)||0);
const dateStr=d=>{const z=new Date(d);return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`};
const today=()=>dateStr(new Date());
const nowISO=()=>new Date().toISOString();
const dtStr=v=>v?new Date(v).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}):'Saat bilgisi yok';
const categoryEmoji=c=>({'Akaryakıt':'⛽','Yakıt':'⛽','Yemek':'🍽️','Market':'🛒','Hobi':'🎨','Eğlence':'🎉','Fatura':'🧾','Araç Bakım':'🔧','Parça Maliyeti':'🧩'}[c]||'💸');
const orderCounts=arr=>arr.reduce((o,v)=>{const n=Number(v.orders)||1;o.first+=1;o.merged+=Math.max(0,n-1);return o},{first:0,merged:0});
function logAction(type,text,amount=0){x.adminLog.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),type,text,amount:Number(amount)||0,at:nowISO()});}
let pendingConfirm=null;
function confirmAction(title,text,onYes){pendingConfirm=onYes;modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="action-row"><button class="btn danger" onclick="const f=pendingConfirm;pendingConfirm=null;closeM();if(f)f()">Geri Al</button><button class="btn secondary" onclick="pendingConfirm=null;closeM()">Vazgeç</button></div>`)}
function donutHtml(grouped,title){const entries=Object.entries(grouped).filter(([,a])=>Number(a)>0).sort((a,b)=>b[1]-a[1]);const total=entries.reduce((s,[,a])=>s+a,0);if(!total)return `<div class="card"><b>${title}</b><div class="muted" style="margin-top:10px">Henüz gider yok.</div></div>`;let cur=0;const colors=['#4f46e5','#ef4444','#f59e0b','#10b981','#06b6d4','#8b5cf6','#ec4899','#84cc16','#64748b'];const stops=entries.map(([c,a],i)=>{const p=a/total*100,st=cur;cur+=p;return `${colors[i%colors.length]} ${st}% ${cur}%`}).join(',');return `<div class="card"><b>${title}</b><div class="donut-wrap" style="margin-top:12px"><div class="donut" style="background:conic-gradient(${stops})"></div><div class="legend">${entries.map(([c,a],i)=>`<div class="legend-item"><span><i class="dot" style="background:${colors[i%colors.length]}"></i>${categoryEmoji(c)} ${esc(c)}</span><b>${(a/total*100).toFixed(1)}% · ${tl(a)}</b></div>`).join('')}<div class="row"><b>Toplam</b><b>${tl(total)}</b></div></div></div></div>`}
function adminView(){const logs=x.adminLog.slice().reverse();return `<h1>🛠️ Admin Paneli</h1><div class="card"><div class="muted">Uygulamadaki işlemlerin tarih ve saat sırasıyla kaydı.</div></div><div class="card">${logs.map(v=>{const cancel=v.type==='cancel',income=v.type==='income',neutral=v.type==='neutral';return `<div class="row"><span>${cancel?'❌':income?'➕':neutral?'📝':'➖'} <b class="${cancel?'admin-x':income?'admin-plus':neutral?'neutral':'admin-minus'}">${esc(v.text)}</b><br><span class="muted">${dtStr(v.at)}</span></span>${v.amount?`<b class="${income?'green':'outflow'}">${income?'+':'-'}${tl(v.amount)}</b>`:''}</div>`}).join('')||'<div class="muted">Henüz işlem kaydı yok.</div>'}</div>`}
function render(){
 let h='';
 if(page==='home'){
  const t=today(),data=periodData(t,t),q=totals(data),debt=x.debts.reduce((s,v)=>s+(Number(v.remaining)||0),0);
  h=`<h1>Finans Takip</h1><div class="card hero"><div>Bugünün Kâr / Zararı</div><div class="big ${signClass(q.net)}">${tl(q.net)}</div><div style="color:#fff;opacity:.95">Gelir ${tl(q.inc)} · Çıkış ${tl(q.outflow)}</div></div><div class="stats"><div class="card"><div class="muted">📦 Toplam Kazanç</div><b class="green">${tl(q.inc)}</b></div><div class="card"><div class="muted">💸 Toplam Gider</div><b class="outflow">${tl(q.outflow)}</b></div></div><div class="card"><div class="spaced"><b>💳 Toplam Borç</b><b class="red">${tl(debt)}</b></div><div class="muted">Tüm aktif banka, kredi kartı ve elden borçlar</div></div>`;
 } else if(page==='courier'){
  const t=today(),p=x.deliveries.filter(v=>v.date===t),km=x.mileage.filter(v=>v.date===t).reduce((s,v)=>s+(Number(v.km)||0),0),mk=x.mileage.filter(v=>v.date===t).reduce((s,v)=>s+(Number(v.km)||0)*(Number(v.rate)||0),0),oc=orderCounts(p),ps=oc.first+oc.merged,dayExp=sum(x.expenses.filter(v=>v.date===t)),dayDebt=sum(x.debtPayments.filter(v=>v.date===t)),dayIncome=sum(p)+mk,dayNet=dayIncome-dayExp-dayDebt;
  h=`<h1>📦 Kurye Kazancı</h1><div class="card hero"><div>Bugünkü Kâr / Zarar</div><div class="big ${signClass(dayNet)}">${tl(dayNet)}</div><div style="color:#fff;opacity:.9">${oc.first} ilk · ${oc.merged} birleşen · ${ps} toplam sipariş · ${km} km</div></div><button class="btn" onclick="addP()">+ Sipariş</button><button class="btn secondary" onclick="addK()">+ Gün Sonu KM</button><div class="card"><div class="row"><span>Sipariş geliri</span><b class="green">${tl(sum(p))}</b></div><div class="row"><span>KM geliri</span><b class="green">${tl(mk)}</b></div><div class="row"><span>Günlük gider</span><b class="outflow">${tl(dayExp)}</b></div><div class="row"><span>Borç/kart ödemesi</span><b class="outflow">${tl(dayDebt)}</b></div><div class="row"><span>Net kâr / zarar</span><b class="${signClass(dayNet)}">${tl(dayNet)}</b></div></div>${p.map(v=>`<div class="card"><div class="spaced"><span><b>${v.orders||1} sipariş</b> <span class="pill">${esc(v.type||'')}</span></span><b class="green">${tl(v.amount)}</b></div><div class="muted">🕒 ${dtStr(v.at||v.date)}</div><div class="action-row"><button class="tiny-btn danger" onclick="deleteDelivery('${v.id}')">Sil</button></div></div>`).join('')}`;
 } else if(page==='expense'){
  const grouped={};x.expenses.forEach(v=>grouped[v.category]=(grouped[v.category]||0)+(Number(v.amount)||0));
  h=`<h1>💸 Giderler</h1><button class="btn" onclick="addE()">+ Gider Ekle</button><button class="btn secondary" onclick="addCategory()">+ Kategori</button>${donutHtml(grouped,'Kategori toplamları')}<div class="card"><b>Son giderler</b>${x.expenses.slice().reverse().slice(0,30).map(v=>`<div class="row"><span>${categoryEmoji(v.category)} ${esc(v.category)}<br><span class="muted">${dtStr(v.at||v.date)}${v.note?' · '+esc(v.note):''}</span></span><span style="text-align:right"><b class="outflow">-${tl(v.amount)}</b><br><button class="tiny-btn danger" onclick="deleteExpense('${v.id}')">Sil</button></span></div>`).join('')||'<div class="muted" style="margin-top:10px">Henüz gider yok.</div>'}</div>`;
 } else if(page==='debt'){
  const active=x.debts.filter(v=>(Number(v.remaining)||0)>0);const total=active.reduce((s,v)=>s+(Number(v.remaining)||0),0);
  h=`<h1>💳 Borçlar</h1><div class="card hero"><div>Toplam Aktif Borç</div><div class="big debt-total">${tl(total)}</div></div><button class="btn" onclick="addD()">+ Borç Ekle</button>${active.map(v=>{const pays=x.debtPayments.filter(p=>p.debtId===v.id).slice().reverse();return `<div class="card"><div class="spaced"><b>${esc(v.name)}</b><span class="pill">${esc(v.kind||'Elden Borç')}</span></div><div class="big">${tl(v.remaining)}</div>${v.kind==='Kredi Kartı'?`<div class="muted">Limit: ${tl(v.limit)} · Kullanılabilir: ${tl(Math.max(0,(Number(v.limit)||0)-(Number(v.remaining)||0)))}</div>`:''}<button class="btn" onclick="payD('${v.id}')">Ödeme Yap</button>${pays.map(p=>`<div class="history">📝 ${tl(p.amount)} ödeme yapıldı · ${dtStr(p.at||p.date)} <button class="tiny-btn danger" onclick="deleteDebtPayment('${p.id}')">Geri Al</button></div>`).join('')}<div class="action-row"><button class="tiny-btn danger" onclick="deleteDebt('${v.id}')">Borcu Sil</button></div></div>`}).join('')||'<div class="card">🎉 Aktif borcun bulunmuyor.</div>'}`;
 } else if(page==='settings') h=settingsView();
 else if(page==='admin') h=adminView();
 else if(page==='report') h=reportView();
 app.innerHTML=h;renderNav();
}
function addP(){modal(`<h2>📦 Sipariş Ekle</h2><p class="muted">Kaç sipariş teslim ettin?</p><div class="grid" id="orderChoices">${Array.from({length:30},(_,i)=>`<button class="choice" onclick="pickOrders(${i+1})">${i+1}</button>`).join('')}</div><div id="orderPreview" class="card" style="margin-top:12px">Bir sayı seç.</div><button class="btn" onclick="saveOrders()">Kaydet</button><button class="btn secondary" onclick="closeM()">Vazgeç</button>`)}
let selectedOrders=0;
function pickOrders(n){selectedOrders=n;document.querySelectorAll('#orderChoices .choice').forEach((b,i)=>b.classList.toggle('selected',i===n-1));document.getElementById('orderPreview').innerHTML=`<b>${n} sipariş</b><br>1. sipariş: ${tl(125)}<br>${n>1?`${n-1} birleşen × ${tl(85)}<br>`:''}<strong>Toplam: ${tl(125+(n-1)*85)}</strong>`}
function saveOrders(){if(!selectedOrders)return alert('Lütfen 1–30 arasında sipariş sayısı seç.');const n=selectedOrders,item={id:Date.now()+'',orders:n,type:n===1?'İlk Sipariş':'1 ilk + '+(n-1)+' birleşen',amount:125+(n-1)*85,date:today(),at:nowISO()};x.deliveries.push(item);logAction('income',`Sipariş verildi: 1 ilk + ${Math.max(0,n-1)} birleşen`,item.amount);selectedOrders=0;save();closeM();render()}
function addK(){modal(`<h2>🛣️ Gün Sonu KM</h2><input id="km" type="number" min="0" step="0.1" placeholder="Toplam KM"><input id="rate" type="number" min="0" step="0.01" value="${Number(x.rate)||6}" placeholder="KM başı ücret"><button class="btn" onclick="saveKm()">Kaydet</button><button class="btn secondary" onclick="closeM()">Vazgeç</button>`)}
function saveKm(){const kmv=num(document.getElementById('km').value),ratev=num(document.getElementById('rate').value);if(!Number.isFinite(kmv)||kmv<0||!Number.isFinite(ratev)||ratev<0)return alert('KM ve KM ücretini doğru gir.');x.mileage.push({km:kmv,rate:ratev,date:today(),at:nowISO()});x.rate=ratev;logAction('income',`KM geliri girildi: ${kmv} km`,kmv*ratev);save();closeM() ;render()}
function addE(){const opts=x.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');modal(`<h2>💸 Gider Ekle</h2><select id="category">${opts}</select><input id="amount" inputmode="decimal" type="text" placeholder="Tutar TL"><input id="note" placeholder="Not (isteğe bağlı)"><button id="saveExpenseBtn" class="btn" onclick="saveExpense()">Kaydet</button><button class="btn secondary" onclick="closeM()">Vazgeç</button>`)}
function saveExpense(){
 if(busy)return;
 const btn=document.getElementById('saveExpenseBtn');
 const a=num(document.getElementById('amount')?.value),c=document.getElementById('category')?.value,n=(document.getElementById('note')?.value||'').trim();
 if(!c||!Number.isFinite(a)||a<=0){alert('Gider kategorisi ve geçerli bir tutar gir.');return}
 busy=true;
 if(btn){btn.disabled=true;btn.classList.add('saving');btn.textContent='Kaydediliyor…'}
 const item={id:Date.now()+'-'+Math.random().toString(36).slice(2),amount:a,category:c,note:n,date:today(),at:nowISO()};
 x.expenses.push(item); logAction('expense',`Gider girildi: ${c}`,a);
 const ok=save();
 if(!ok){x.expenses.pop();busy=false;if(btn){btn.disabled=false;btn.classList.remove('saving');btn.textContent='Kaydet'}return}
 closeM();
 setTimeout(()=>{busy=false;render()},120);
}
function addCategory(){modal(`<h2>Yeni Gider Kategorisi</h2><input id="newcat" placeholder="Örn. Telefon"><button class="btn" onclick="saveCategory()">Ekle</button><button class="btn secondary" onclick="closeM()">Vazgeç</button>`)}
function saveCategory(){const c=document.getElementById('newcat').value.trim();if(!c)return alert('Kategori adı gir.');if(!x.categories.some(v=>v.toLowerCase()===c.toLowerCase()))x.categories.push(c);save();closeM();render()}
function addD(){modal(`<h2>💳 Borç Ekle</h2><input id="name" placeholder="Ad / Banka / Kişi"><select id="kind" onchange="toggleCardFields()"><option value="Elden Borç">Elden Borç</option><option value="Kredi Kartı">Kredi Kartı</option></select><input id="total" type="number" min="0" step="0.01" placeholder="Borç tutarı TL"><div id="cardFields" style="display:none"><input id="limit" type="number" min="0" step="0.01" placeholder="Kredi kartı limiti TL"><input id="rateM" type="number" min="0" step="0.01" placeholder="Aylık faiz %"><input id="rateLate" type="number" min="0" step="0.01" placeholder="Gecikme faizi %"></div><input id="monthly" type="number" min="0" step="0.01" placeholder="Aylık ödeme (isteğe bağlı)"><button class="btn" onclick="saveDebt()">Borcu Kaydet</button><button class="btn secondary" onclick="closeM()">Vazgeç</button>`)}
function toggleCardFields(){document.getElementById('cardFields').style.display=document.getElementById('kind').value==='Kredi Kartı'?'block':'none'}
function saveDebt(){
 if(busy)return;
 const nameEl=document.getElementById('name'), kindEl=document.getElementById('kind'), totalEl=document.getElementById('total');
 if(!nameEl||!kindEl||!totalEl)return;
 const name=nameEl.value.trim(),kind=kindEl.value,total=num(totalEl.value),monthly=num(document.getElementById('monthly')?.value)||0;
 if(!name||!Number.isFinite(total)||total<=0){alert('Ad ve geçerli bir borç tutarı giriniz.');return}
 let limit=0,rateM=0,rateLate=0;
 if(kind==='Kredi Kartı'){
  limit=num(document.getElementById('limit')?.value)||0;rateM=num(document.getElementById('rateM')?.value)||0;rateLate=num(document.getElementById('rateLate')?.value)||0;
  if(limit<=0||limit<total){alert('Kredi kartı limiti, mevcut borçtan düşük olamaz ve 0 olamaz.');return}
 }
 const btn=[...document.querySelectorAll('#d .btn')].find(b=>b.textContent.includes('Borcu Kaydet'));
 busy=true;if(btn){btn.disabled=true;btn.textContent='Kaydediliyor…'}
 const debt={id:Date.now()+'-'+Math.random().toString(36).slice(2),name,kind,total,remaining:total,monthly,limit,rateM,rateLate,interestAccrued:0,paid:0,createdAt:nowISO()};
 x.debts.push(debt);
 logAction('neutral',`Borç tanımlandı: ${name}`,0);
 if(!save()){x.debts.pop();busy=false;if(btn){btn.disabled=false;btn.textContent='Borcu Kaydet'}return}
 closeM();setTimeout(()=>{busy=false;render()},120);
}
function payD(id){if(busy)return;const v=x.debts.find(v=>v.id===id);if(!v)return;const raw=prompt(`${v.name} için ödeme tutarı:`);if(raw===null)return;const a=num(raw);if(!Number.isFinite(a)||a<=0)return alert('Geçerli bir ödeme tutarı gir.');busy=true;const oldRemaining=v.remaining,oldPaid=v.paid;v.remaining=Math.max(0,(Number(v.remaining)||0)-a);v.paid=(Number(v.paid)||0)+a;x.debtPayments.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),debtId:v.id,name:v.name,kind:v.kind||'Elden Borç',amount:a,date:today(),at:nowISO()}); logAction('expense',`Borç ödendi: ${v.name}`,a);if(v.remaining===0){v.remaining=0;v.closedAt=today()}if(!save()){v.remaining=oldRemaining;v.paid=oldPaid;x.debtPayments.pop();busy=false;return}busy=false;render()}
function deleteDelivery(id){confirmAction('Siparişi geri al','Bu sipariş kaydı geri alınsın mı?',()=>{const i=x.deliveries.findIndex(v=>v.id===id);if(i<0)return;const v=x.deliveries[i];x.deliveries.splice(i,1);logAction('cancel',`Sipariş iptal edildi: ${v.type||v.orders+' sipariş'}`,v.amount);save();render()})}
function deleteExpense(id){confirmAction('Gideri geri al','Bu gider kaydı geri alınsın mı?',()=>{const i=x.expenses.findIndex(v=>v.id===id);if(i<0)return;const v=x.expenses[i];x.expenses.splice(i,1);logAction('cancel',`Gider iptal edildi: ${v.category}`,v.amount);save();render()})}
function deleteDebtPayment(id){confirmAction('Borç ödemesini geri al','Bu borç ödemesi geri alınsın mı?',()=>{const i=x.debtPayments.findIndex(v=>v.id===id);if(i<0)return;const p=x.debtPayments[i],d=x.debts.find(v=>v.id===p.debtId);if(d){d.remaining=(Number(d.remaining)||0)+Number(p.amount||0);d.paid=Math.max(0,(Number(d.paid)||0)-Number(p.amount||0));delete d.closedAt}x.debtPayments.splice(i,1);logAction('cancel',`Borç ödemesi iptal edildi: ${p.name}`,p.amount);save();render()})}
function deleteDebt(id){confirmAction('Borcu sil','Bu borç ve bağlı ödeme kayıtları silinsin mi?',()=>{const i=x.debts.findIndex(v=>v.id===id);if(i<0)return;const v=x.debts[i];x.debts.splice(i,1);x.debtPayments=x.debtPayments.filter(p=>p.debtId!==id);logAction('cancel',`Borç silindi: ${v.name}`,v.remaining);save();render()})}

function settingsView(){
 const dark=document.body.classList.contains('dark');
 const last=x.lastBackupAt?new Date(x.lastBackupAt).toLocaleString('tr-TR'):'Henüz yedek alınmadı';
 return `<h1>⚙️ Ayarlar</h1>
 <div class="card"><b>🎨 Görünüm</b><div class="settings-row"><span>Açık / Koyu tema</span><select onchange="setTheme(this.value)"><option value="light" ${!dark?'selected':''}>Açık Tema</option><option value="dark" ${dark?'selected':''}>Koyu Tema</option></select></div></div>
 <div class="card"><b>🔐 Veri Yedekleme</b><div id="backupStatus" class="status">Son yedek: ${esc(last)}</div><button class="btn" onclick="manualBackup()">📤 Yedeği Dışa Aktar</button><button class="btn secondary" onclick="document.getElementById('backupFile').click()">📥 Yedeği Geri Yükle</button><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this.files[0])"><div class="muted" style="margin-top:10px">Günlük otomatik yedek telefonun içinde hazırlanır. iCloud Drive'a göndermek için iOS paylaşım ekranından iCloud Drive'ı seçmen gerekir.</div></div>
 <div class="card"><b>☁️ Günlük Yedek</b><div class="muted" style="margin:8px 0">Uygulama her gün ilk açıldığında otomatik bir yedek dosyası oluşturur. iOS, web uygulamalarının iCloud Drive'a sessizce dosya yazmasına izin vermediği için iCloud'a kaydetme işlemi bir dokunuşla yapılır.</div><button class="btn secondary" onclick="dailyBackup(true)">☁️ Bugünkü Yedeği iCloud'a Kaydet</button></div>`;
}
function setTheme(v){document.body.classList.toggle('dark',v==='dark');localStorage.setItem('finansTheme',v)}
function backupObject(){const data=JSON.parse(JSON.stringify(x));delete data.autoBackup;return {format:'FinansTakipBackup',version:4,exportedAt:new Date().toISOString(),data}}
function downloadBackup(){const blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'});const a=document.createElement('a');const d=new Date();const fn=`FinansTakip_Yedek_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);x.lastBackupAt=new Date().toISOString();save();render();setTimeout(()=>alert('✅ Yedek oluşturuldu. Şimdi Dosyalar > iCloud Drive konumunu seçerek kaydedebilirsin.'),80)}
async function shareBackup(){const blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'});const d=new Date();const fn=`FinansTakip_Yedek_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;const file=new File([blob],fn,{type:'application/json'});if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){try{await navigator.share({title:'Finans Takip Yedeği',files:[file]});x.lastBackupAt=new Date().toISOString();save();render();setTimeout(()=>alert("✅ Yedek hazırlandı. Paylaşım ekranından iCloud Drive'ı seçerek kaydedebilirsin."),80);return true}catch(e){if(e.name==='AbortError')return false}}downloadBackup();return true}
function manualBackup(){shareBackup()}
function dailyBackup(force=false){
 const key=today();
 if(!force && x.lastAutoBackupDate===key)return;
 const snapshot=JSON.parse(JSON.stringify(x));
 delete snapshot.autoBackup;
 x.lastAutoBackupDate=key;
 x.lastBackupAt=new Date().toISOString();
 x.autoBackup={format:'FinansTakipBackup',version:3,exportedAt:new Date().toISOString(),data:snapshot};
 save();
 if(force)shareBackup();
}

function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);const d=b.data||b;if(!d||!Array.isArray(d.deliveries)||!Array.isArray(d.expenses)||!Array.isArray(d.debts))throw new Error('Geçersiz yedek');if(!confirm('Bu işlem mevcut verilerin üzerine yedeği yükleyecek. Devam edilsin mi?'))return;x=d;delete x.autoBackup;if(!Array.isArray(x.deliveries))x.deliveries=[];if(!Array.isArray(x.mileage))x.mileage=[];if(!Array.isArray(x.expenses))x.expenses=[];if(!Array.isArray(x.debts))x.debts=[];if(!Array.isArray(x.debtPayments))x.debtPayments=[];if(!Array.isArray(x.adminLog))x.adminLog=[];if(!Array.isArray(x.categories))x.categories=['Market','Akaryakıt','Hobi','Eğlence','Fatura','Araç Bakım','Parça Maliyeti'];save();alert('Yedek başarıyla geri yüklendi.');render()}catch(e){alert('Yedek dosyası okunamadı. Lütfen Finans Takip tarafından oluşturulmuş JSON dosyası seç.')}};r.readAsText(file)}
function reportView(){
 const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);let start=dateStr(first),end=today();
 const s=window.reportStart||start,e=window.reportEnd||end;const data=periodData(s,e),q=totals(data);const cats={};data.expenses.forEach(v=>cats[v.category]=(cats[v.category]||0)+(Number(v.amount)||0));if(q.debtOut)cats['Borç / Kredi Kartı Ödemeleri']=q.debtOut;
 return `<h1>📊 Raporlar</h1><div class="card"><b>Özel tarih aralığı</b><div class="muted" style="margin:6px 0 10px">Takvimden başlangıç ve bitiş gününü seç.</div><div class="spaced"><input id="rstart" type="date" value="${s}" onchange="window.reportStart=this.value;render()"><input id="rend" type="date" value="${e}" onchange="window.reportEnd=this.value;render()"></div><div class="calendar-wrap">${calendarHtml(s,e)}</div></div><div class="stats"><div class="stat"><span class="muted">Gelir</span><br><b class="green">${tl(q.inc)}</b></div><div class="stat"><span class="muted">Gider</span><br><b class="outflow">${tl(q.outflow)}</b></div><div class="stat"><span class="muted">Net</span><br><b class="${signClass(q.net)}">${tl(q.net)}</b></div><div class="stat"><span class="muted">Sipariş</span><br><b>${orderCounts(data.deliveries).first} ilk · ${orderCounts(data.deliveries).merged} birleşen</b><br><span class="muted">Toplam ${orderCounts(data.deliveries).first+orderCounts(data.deliveries).merged}</span></div></div>${donutHtml(cats,'Harcama dağılımı')}<div class="card"><b>Gün gün</b>${dailyReport(s,e)}</div>`
}
function calendarHtml(start,end){const sd=new Date(start+'T12:00:00'),ed=new Date(end+'T12:00:00');let y=sd.getFullYear(),m=sd.getMonth();let first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,h='<div class="calendar">';['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].forEach(d=>h+=`<div class="calhead">${d}</div>`);for(let i=0;i<lead;i++)h+='<div></div>';for(let d=1;d<=days;d++){const ds=dateStr(new Date(y,m,d,12));const cls=(ds===start?' start ':'')+(ds===end?' end ':'')+(ds>=start&&ds<=end?' inrange':'');h+=`<button class="day${cls}" onclick="calendarPick('${ds}')">${d}</button>`}return h+'</div>'}
let selectingStart=true;
function calendarPick(ds){if(selectingStart){window.reportStart=ds;selectingStart=false}else{window.reportEnd=ds;if(window.reportEnd<window.reportStart){const t=window.reportStart;window.reportStart=window.reportEnd;window.reportEnd=t}selectingStart=true}render()}
function dailyReport(s,e){let out='';for(let d=new Date(s+'T12:00:00');dateStr(d)<=e;d.setDate(d.getDate()+1)){const ds=dateStr(d),data=periodData(ds,ds),q=totals(data);if(q.inc||q.exp)out+=`<div class="row"><span>${ds}<br><span class="muted">Gelir ${tl(q.inc)} · Gider ${tl(q.exp)} · Borç/Kart ${tl(q.debtOut)}</span></span><b class="${signClass(q.net)}">${tl(q.net)}</b></div>`}return out||'<div class="muted" style="margin-top:10px">Seçilen aralıkta işlem yok.</div>'}
if(x.adminLog.length===0){
 x.deliveries.forEach(v=>x.adminLog.push({id:'legacy-'+v.id,type:'income',text:`Geçmiş sipariş kaydı: ${v.type||v.orders+' sipariş'}`,amount:Number(v.amount)||0,at:v.at||v.date}));
 x.expenses.forEach(v=>x.adminLog.push({id:'legacy-'+v.id,type:'expense',text:`Geçmiş gider kaydı: ${v.category}`,amount:Number(v.amount)||0,at:v.at||v.date}));
 x.debtPayments.forEach(v=>x.adminLog.push({id:'legacy-'+v.id,type:'expense',text:`Geçmiş borç ödemesi: ${v.name}`,amount:Number(v.amount)||0,at:v.at||v.date}));
 x.debts.forEach(v=>x.adminLog.push({id:'legacy-debt-'+v.id,type:'neutral',text:`Geçmiş borç kaydı: ${v.name}`,amount:0,at:v.createdAt||today()}));
 save();
}
const savedTheme=localStorage.getItem('finansTheme')||'light';document.body.classList.toggle('dark',savedTheme==='dark');dailyBackup();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
